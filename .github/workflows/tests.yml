name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.txt
          python -m pip install --require-hashes --no-deps -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest -q

      - name: Check the repository for secrets and internal material
        run: python scripts/public_check.py

      - name: Check dependencies for known vulnerabilities
        run: |
          python -m pip_audit -r requirements.txt --require-hashes --progress-spinner off
          python -m pip_audit -r requirements-dev.txt --require-hashes --progress-spinner off
